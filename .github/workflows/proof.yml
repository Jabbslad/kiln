name: Proof status

on:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: proof-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  status:
    name: proof-status
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set proof status
        run: python scripts/proof_status.py
