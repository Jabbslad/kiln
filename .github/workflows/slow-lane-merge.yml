name: Slow-lane merge

on:
  workflow_run:
    workflows: [Build and package]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  slow-lane-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require deploy success in the triggering run
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          conclusion=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '[.jobs[] | select(.name == "deploy" or .name == "deploy / deploy") | .conclusion] | .[0] // empty')
          if [ "$conclusion" != success ]; then
            printf 'deploy job conclusion was %s\n' "${conclusion:-missing}"
            exit 0
          fi
          printf 'deploy=success\n' >> "$GITHUB_OUTPUT"
      - name: Merge next slow-lane pull request
        if: steps.deploy.outputs.deploy == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/slow-lane-merge.sh
