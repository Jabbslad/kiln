name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag. latest selects the newest one.
        required: false
        default: latest
        type: string
      address:
        description: Private or VPN IPv4 for the API. Empty detects one private source address.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to install
        required: false
        default: latest
        type: string
      sha:
        description: Build commit that must still be the tip of main. Empty on a manual deploy.
        required: false
        default: ''
        type: string
      address:
        description: Private or VPN IPv4 for the API. Empty detects one private source address.
        required: false
        default: ""
        type: string

# Runners install a published release. Pull requests and forks never reach this job.
permissions:
  contents: read

concurrency:
  group: dark-forge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: dark-forge
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Skip deploy when main has moved on
        id: tip
        if: inputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          status=0
          sh scripts/release-tip-gate.sh || status=$?
          if [ "$status" -eq 2 ]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - name: Require a published release
        if: inputs.sha == '' || steps.tip.outputs.proceed == 'true'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/github/require-release.sh
      - name: Install the release
        if: inputs.sha == '' || steps.tip.outputs.proceed == 'true'
        env:
          DARK_FORGE_SSH_KEY: ${{ secrets.DARK_FORGE_SSH_KEY }}
          DARK_FORGE_KNOWN_HOSTS: ${{ secrets.DARK_FORGE_KNOWN_HOSTS }}
          KILN_RELEASE_TAG: ${{ inputs.tag }}
          KILN_ADDRESS: ${{ github.event_name == 'workflow_dispatch' && inputs.address || '' }}
        run: bash deploy/github/deploy.sh
