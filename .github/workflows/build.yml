name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check main's packages for a commit and upload the asset set. Do not create a release.
        type: boolean
        default: false
      reuse_sha:
        description: Commit to reuse when dry_run is true. A tag push ignores this.
        type: string
        default: ''

# Build jobs cannot publish or deploy. Never run PR code on the real KVM host.
# actions: write is omitted. The cache service uses the runner token, and that
# permission would let a build step start workflow_dispatch.
permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # A documentation pull request or merge group skips the compile jobs below.
  # The job if reports the skip. A workflow path filter would leave a required check pending.
  # Push, tag, and workflow_dispatch do not consult the diff.
  # This job still runs on those events and records heavy=true. Skipping it would
  # skip draft-release, because a skipped needs job travels to the release job.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            base="$MERGE_BASE_SHA"
            head="$MERGE_HEAD_SHA"
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides. A rename out of Rust still builds.
          git diff --name-only --no-renames "$base" "$head" | python scripts/ci_docs_only.py >> "$GITHUB_OUTPUT"

  # This job runs on a heavy diff too. server-check installs Caddy, so
  # skipping this job hides a missing binary until the next docs-only pull request.
  docs-check:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Caddy
        run: bash scripts/install-caddy.sh
      - name: Python checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/test-ci-docs-only.py
          python scripts/test-release-version.py
          python scripts/test-release.py
          python scripts/test-install.py
          python scripts/test-bootstrap.py
          python scripts/test-close-public-door.py
          python scripts/test-caddy-door.py
          python scripts/test-deploy-workflow.py
          python scripts/test-reuse-release.py
          python scripts/test-merge-queue-tested.py
          python scripts/test-proof-status.py
          bash scripts/test-listener-restart.sh
          sh scripts/test-caddy-endings.sh
          sh scripts/test-bootstrap-pins.sh
          sh scripts/test-installer-release.sh

  # A verified tag reuse already ran this job on main for the same commit.
  # A fallback, a main push, and a heavy pull request still run it.
  server-check:
    needs: [changes, reuse]
    if: >-
      !cancelled() &&
      (needs.reuse.result == 'skipped' ||
        !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse' && needs.reuse.outputs.server_check == 'success')) &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.heavy != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/merge_queue_tested.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.queue.outputs.skip_tests != 'true'
        with:
          node-version: '22'
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Stamp release version
        if: steps.queue.outputs.skip_tests != 'true'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/release_version.py resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - name: Toolchain
        if: steps.queue.outputs.skip_tests != 'true'
        run: rustup show
      # Tag builds ship binaries, so they do not restore or save a cache.
      # Keep the kiln crates in the cache so a warm run reuses them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.queue.outputs.skip_tests != 'true' && !startsWith(github.ref, 'refs/tags/v')
        with:
          cache-workspace-crates: 'true'
      - name: Install Caddy
        if: steps.queue.outputs.skip_tests != 'true'
        run: bash scripts/install-caddy.sh
      - name: Socket activation tools
        if: steps.queue.outputs.skip_tests != 'true'
        run: |
          missing=
          command -v systemd-socket-activate >/dev/null || missing=1
          command -v ss >/dev/null || missing=1
          if [ ! -x /lib/systemd/systemd-socket-proxyd ] && [ ! -x /usr/lib/systemd/systemd-socket-proxyd ]; then
            missing=1
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y systemd iproute2
          fi
      - name: Test and lint
        if: steps.queue.outputs.skip_tests != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          python scripts/test-release-version.py
          python scripts/test-release.py
          python scripts/test-install.py
          python scripts/test-bootstrap.py
          python scripts/test-close-public-door.py
          python scripts/test-caddy-door.py
          python scripts/test-deploy-workflow.py
          python scripts/test-ci-docs-only.py
          python scripts/test-reuse-release.py
          python scripts/test-merge-queue-tested.py
          python scripts/test-proof-status.py
          bash scripts/test-listener-restart.sh
          sh scripts/test-caddy-endings.sh
          sh scripts/test-bootstrap-pins.sh
          sh scripts/test-installer-release.sh
          shellcheck scripts/fetch-firecracker.sh scripts/install-caddy.sh scripts/check-bootstrap-pins.sh scripts/test-bootstrap-pins.sh scripts/test-caddy-endings.sh images/build-ubuntu.sh deploy/install.sh deploy/bootstrap/install.sh \
            deploy/enroll-dark-forge.sh \
            deploy/github/guard.sh deploy/github/ssh.sh deploy/github/deploy.sh \
            deploy/github/require-release.sh \
            deploy/github/install-remote.sh deploy/github/smoke.sh \
            deploy/github/diagnose.sh deploy/github/diagnose-run.sh \
            scripts/test-listener-restart.sh \
            scripts/test-installer-release.sh \
            scripts/check-tag-version.sh scripts/reuse-server-check.sh

  # A v* tag publishes main's packages for that commit when the run verifies.
  # A miss falls through to the cache-free package jobs.
  reuse:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      reason: ${{ steps.decide.outputs.reason }}
      server_check: ${{ steps.decide.outputs.server_check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Peel the tagged commit
        if: github.event_name == 'push'
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
      - name: Reuse main's packages when they verify
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_EVENT: ${{ github.event_name }}
          REUSE_SHA: ${{ github.sha }}
          REUSE_SHA_INPUT: ${{ inputs.reuse_sha }}
        # REUSE_VERSION stays unset. fetch reads Cargo.toml at that commit.
        # Package jobs named the archives with that version. version-guard
        # refuses the tag unless it is the same version.
        run: |
          if [ "$REUSE_EVENT" = workflow_dispatch ] && [ -z "$REUSE_SHA_INPUT" ]; then
            REUSE_SHA_INPUT=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
            export REUSE_SHA_INPUT
          fi
          python3 scripts/reuse_release.py fetch --dist dist
          sh scripts/reuse-server-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.decide.outputs.mode == 'reuse'
        with:
          name: reused-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # A verified tag reuse skips this job. Any other result on a push runs it.
  # Pull requests and merge groups never package the server.
  server-package:
    needs: [reuse]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.reuse.result == 'skipped' ||
        (github.event_name == 'push' &&
          !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/release_version.py resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - name: Toolchain
        run: rustup show
      # Tag builds ship binaries, so they do not restore or save a cache.
      # Keep the kiln crates in the cache so a warm run reuses them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          cache-workspace-crates: 'true'
      - name: Build release binaries
        run: |
          cargo build --release --locked --bins -p kiln-server -p kiln-runtime -p kiln-client
          # One cargo command unifies features and links h2 into kiln-identity.
          # lab-provider stays off this command. The release binary cannot select a substitute provider.
          cargo build --release --locked -p kiln-identity
          target/release/kiln-host --help
          target/release/kiln-api --help
          python scripts/release_version.py check-binary --version "$VERSION" -- \
            target/release/kiln \
            target/release/kiln-runtime \
            target/release/kiln-host \
            target/release/kiln-api \
            target/release/kiln-identity
          case "$(target/release/kiln-identity --help)" in
            *github-authorize-url*|*github-token-url*|*github-user-url*|*provider-ca-file*)
              echo "release kiln-identity must not accept a substitute provider" >&2
              exit 1
              ;;
          esac
      - name: Package identity service
        run: |
          python scripts/release.py identity --version "$VERSION" --target x86_64-unknown-linux-gnu \
            --bin-dir target/release --output dist
      - name: Build pinned warm guest image without root
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot musl-tools e2fsprogs curl binutils xz-utils
          rustup target add x86_64-unknown-linux-musl
          bash images/build-ubuntu.sh images/output/release '' systemd_warm
      - name: Package server with prebuilt image
        run: |
          python scripts/release.py server --version "$VERSION" --target x86_64-unknown-linux-gnu \
            --bin-dir target/release --image-dir images/output/release --output dist
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-server
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Docs-only pull requests and merge groups skip this job. A verified tag reuse skips it too.
  client:
    needs: [changes, reuse]
    if: >-
      !cancelled() &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.heavy != 'false') &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
        needs.reuse.result == 'skipped' ||
        (github.event_name == 'push' &&
          !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/merge_queue_tested.py
      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/release_version.py resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - name: Toolchain
        run: rustup show
      # Tag builds ship binaries, so they do not restore or save a cache.
      # Keep the kiln crates in the cache so a warm run reuses them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          cache-workspace-crates: 'true'
      - name: Native client TLS and CLI tests
        if: steps.queue.outputs.skip_tests != 'true'
        run: cargo test --locked -p kiln-api -p kiln-client --target ${{ matrix.target }}
      - name: Native shell bootstrap tests
        if: runner.os != 'Windows' && steps.queue.outputs.skip_tests != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/test-bootstrap.py
      - name: Production binary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cargo build --release --locked -p kiln-client --bin kiln --target ${{ matrix.target }}
          python scripts/release_version.py check-binary --version "$VERSION" -- \
            target/${{ matrix.target }}/release/kiln${{ matrix.suffix }}
      - name: Package client
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/test-release.py
          python scripts/release.py client --version "$VERSION" --target ${{ matrix.target }} \
            --bin-dir target/${{ matrix.target }}/release --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # The intel runner is gone. This arm job still publishes package-x86_64-apple-darwin.
      - name: Cross-compile x86_64 macOS client
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked -p kiln-client --bin kiln --target x86_64-apple-darwin
          python scripts/release_version.py check-binary --version "$VERSION" -- \
            target/x86_64-apple-darwin/release/kiln
      - name: Package x86_64 macOS client
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.target == 'aarch64-apple-darwin'
        run: |
          python scripts/release.py client --version "$VERSION" --target x86_64-apple-darwin \
            --bin-dir target/x86_64-apple-darwin/release --output dist-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.target == 'aarch64-apple-darwin'
        with:
          name: package-x86_64-apple-darwin
          path: dist-x86_64/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Docs-only pull requests and merge groups skip this job. A verified tag reuse skips it too.
  dashboard:
    needs: [changes, reuse]
    if: >-
      !cancelled() &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.heavy != 'false') &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
        needs.reuse.result == 'skipped' ||
        (github.event_name == 'push' &&
          !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/merge_queue_tested.py
      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: python scripts/release_version.py resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          # Empty on a v* tag, so setup-node skips restore and save and still installs Node.
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci
      - name: Test dashboard
        if: steps.queue.outputs.skip_tests != 'true'
        working-directory: web
        run: |
          npm test
          npx prettier --check .
      - name: Build dashboard
        working-directory: web
        run: npm run build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.queue.outputs.skip_tests != 'true' && !startsWith(github.ref, 'refs/tags/v')
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Browser tests
        if: steps.queue.outputs.skip_tests != 'true'
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Package static dashboard
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/test-release.py
          python scripts/release.py dashboard --version "$VERSION" --target web \
            --bin-dir web/dist --output dist
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: package-dashboard
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # reuse is skipped on main. An if with no status function is rewritten
  # to success(), and success() is false when an ancestor was skipped,
  # so this job never ran. !cancelled() blocks that rewrite. The result
  # checks still require the jobs that wrote the archives a tag publishes.
  attest:
    needs: [server-package, client, dashboard]
    if: >-
      !cancelled() &&
      needs.server-package.result == 'success' &&
      needs.client.result == 'success' &&
      needs.dashboard.result == 'success' &&
      ((github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # A v* tag stops here unless it matches Cargo.toml at that commit.
  # When main's archives are reused, the Linux client must report that version.
  # !cancelled() keeps a skipped reuse from rewriting this if to success().
  # The result check still requires the reuse job to have succeeded.
  version-guard:
    needs: [reuse]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.reuse.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the tag to match Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo=$(awk '
            /^\[workspace\.package\]$/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version = "/ {
              line = $0
              sub(/^version = "/, "", line)
              sub(/"$/, "", line)
              print line
              exit
            }
          ' Cargo.toml)
          test -n "$cargo"
          sh scripts/check-tag-version.sh "$TAG" "$cargo"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse'
        with:
          name: reused-dist
          path: dist
      - name: Require the reused Linux binary to report the tag
        if: needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          archive="kiln-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          (cd dist && sha256sum -c "${archive}.sha256")
          tar -xzf "dist/${archive}" -C "$RUNNER_TEMP" kiln
          python3 scripts/release_version.py check-binary --version "$TAG" -- "$RUNNER_TEMP/kiln"

  # A client matrix leg and a skipped client job are different check names.
  # always() still runs when a dependency fails or is skipped. Without it,
  # GitHub skips this job and the check never reports.
  required:
    needs: [changes, docs-check, server-check, client, dashboard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Required check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/required_gate.py

  # Reuse publishes from main's proof, including that run's server-check.
  # A rebuild still waits for this run's server-check and its package jobs.
  draft-release:
    needs: [version-guard, server-check, reuse, server-package, client, dashboard, attest]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.version-guard.result == 'success' &&
      ((needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse') &&
        needs.reuse.outputs.server_check == 'success' ||
        (needs.server-check.result == 'success' &&
          needs.server-package.result == 'success' &&
          needs.client.result == 'success' &&
          needs.dashboard.result == 'success' &&
          needs.attest.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse'
        with:
          name: reused-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reuse.result != 'success' || needs.reuse.outputs.mode != 'reuse'
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify packages and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.reuse.outputs.mode == 'reuse' && needs.reuse.outputs.version || github.ref_name }}
          REUSE_MODE: ${{ needs.reuse.outputs.mode }}
        run: |
          started=$(date +%s)
          python3 scripts/reuse_release.py finish --version "$VERSION" --dist dist
          (cd dist && sha256sum -c ./*.sha256)
          if [ "$REUSE_MODE" = reuse ]; then
            source_ref=refs/heads/main
          else
            source_ref="refs/tags/${TAG}"
          fi
          regex='^https://github\.com/Jabbslad/kiln/\.github/workflows/build\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
          found=0
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -f "$archive" ] || continue
            found=1
            gh attestation verify "$archive" --repo Jabbslad/kiln \
              --cert-identity-regex "$regex" --source-ref "$source_ref"
          done
          [ "$found" = 1 ]
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes 'Trusted-workload pilot. Native client tests and Linux build checks passed. The unattended installer requires Ubuntu 24.04 or 26.04 x86-64/KVM for servers. Checksums and attestations were verified in this job before publish. Binaries are not signed or notarized.'
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            seconds=$(( $(date +%s) - started ))
            printf '| Stage | Seconds |\n| --- | ---: |\n| publish | %s |\n' "$seconds" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A release created with this workflow's GITHUB_TOKEN does not emit
  # release: published, so the tag calls deploy in the same run.
  deploy:
    needs: [draft-release]
    if: >-
      !cancelled() &&
      needs.draft-release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  dry-run-assets:
    needs: [reuse]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.dry_run &&
      needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reused-dist
          path: dist
      - name: Build the asset set without publishing
        env:
          VERSION: ${{ needs.reuse.outputs.version }}
        run: |
          python3 scripts/reuse_release.py finish --version "$VERSION" --dist dist
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  reuse-fallback:
    needs: [reuse]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.dry_run &&
      needs.reuse.outputs.mode == 'fallback'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record that a tag push would build from scratch
        env:
          REASON: ${{ needs.reuse.outputs.reason }}
        run: echo "reuse refused (${REASON}) and a tag push would build from scratch"
