name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check main's packages for a commit and upload the asset set. Do not create a release.
        type: boolean
        default: false
      reuse_sha:
        description: Commit to reuse when dry_run is true. Empty uses the latest main commit.
        type: string
        default: ''
      batch_base_sha:
        description: Main commit before a batch merge; used for release planning when this run follows Batch merge.
        type: string
        default: ''

# Build jobs cannot publish or deploy. Never run PR code on the real KVM host.
# actions: write is omitted. The cache service uses the runner token, and that
# permission would let a build step start workflow_dispatch.
permissions:
  contents: read

# Main pushes each get their own group so a second merge cannot cancel a deploy.
# Pull requests and merge groups still cancel the previous run on that ref.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('build-main-{0}', github.sha) || format('build-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A documentation pull request or merge group skips the compile jobs below.
  # The job if reports the skip. A workflow path filter would leave a required check pending.
  # Push, tag, and workflow_dispatch do not consult the diff.
  # This job still runs on those events and records heavy=true. Skipping it would
  # skip draft-release, because a skipped needs job travels to the release job.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      docs: ${{ steps.filter.outputs.docs }}
      release_path: ${{ steps.filter.outputs.release_path }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: >-
          github.event_name == 'pull_request' ||
          github.event_name == 'merge_group' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            base="$MERGE_BASE_SHA"
            head="$MERGE_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              git show --name-only --pretty=format: "$head" | cargo xtask ci-job-paths >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "release_path=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides. A rename out of Rust still builds.
          git diff --name-only --no-renames "$base" "$head" | cargo xtask ci-job-paths >> "$GITHUB_OUTPUT"

  # Documentation diffs run this job. Code-only pull requests skip it and rely
  # on server-check. A skipped job still reports for the required gate.
  docs-check:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Caddy
        run: bash scripts/install-caddy.sh
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.104
      - name: Repository checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo xtask test-ci-docs-only
          cargo xtask test-ci-job-paths
          sh scripts/test-dashboard-npm-ci.sh
          sh scripts/test-playwright-ci-cache.sh
          cargo xtask test-release-version
          cargo xtask test-release
          cargo xtask test-install
          cargo xtask test-bootstrap
          cargo xtask test-close-public-door
          cargo xtask test-caddy-door
          cargo xtask test-deploy-workflow
          cargo xtask test-reuse-release
          cargo xtask test-merge-queue-tested
          sh scripts/test-reuse-proved-server-package.sh
          cargo xtask test-cancel-on-failure-gate
          cargo xtask test-repo-guard
          bash scripts/test-listener-restart.sh
          sh scripts/test-install-upgrade-failure-message.sh
          bash scripts/test-wait-for-operations-journal-v2.sh
          bash scripts/test-identity-upgrade.sh
          bash scripts/test-login-token.sh
          sh scripts/test-caddy-endings.sh
          sh scripts/test-proof-door-ssh-caddy.sh
          sh scripts/test-bootstrap-pins.sh
          sh scripts/test-installer-release.sh
          sh scripts/test-wait-main-run.sh
          sh scripts/test-batch-merge.sh
          sh scripts/test-tag-path-dry-run.sh
          sh scripts/test-tag-path-pr-stamp-order.sh
          sh scripts/test-deploy-host-tools.sh
          sh scripts/test-release-json-field.sh
          sh scripts/test-check-dashboard-bundle.sh
          cargo test -p kiln-server --test dashboard_self_check --locked
          sh scripts/test-check-installed-versions.sh
          sh scripts/test-releasable.sh
          sh scripts/test-next-release-tag.sh
          sh scripts/test-plan-release.sh
          sh scripts/test-check-stamped-clients.sh
          sh scripts/test-release-budget.sh
          sh scripts/test-verify-release-attestations.sh
          sh scripts/test-check-dropped-platform.sh
          sh scripts/test-feature-map-guard.sh
          sh scripts/test-check-pr-proof.sh
          sh scripts/test-operations-journal-version-sync.sh
          sh scripts/test-tenant-isolation.sh
          sh scripts/test-release-notes.sh
          sh scripts/test-fmt.sh
          sh scripts/test-check.sh
          sh scripts/test-server-check-nextest.sh
          sh scripts/test-server-check-hang-evidence.sh
          sh scripts/test-pre-push-hook.sh
          sh scripts/test-ssh-multiplex.sh

  feature-map-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Feature map rule
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --name-only --no-renames "$PR_BASE_SHA" HEAD \
            | sh scripts/check-feature-map.sh

  pr-proof-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: PR proof rule
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --name-only --no-renames "$PR_BASE_SHA" HEAD \
            | sh scripts/check-pr-proof.sh

  # A verified tag reuse already ran this job on main for the same commit.
  # A fallback, a main push, and a heavy pull request still run it.
  server-check:
    needs: [changes, reuse]
    if: >-
      !cancelled() &&
      (needs.reuse.result == 'skipped' ||
        !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse' && needs.reuse.outputs.server_check == 'success')) &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.heavy != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask merge-queue-tested
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.queue.outputs.skip_tests != 'true'
        with:
          node-version: '22'
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Stamp release version
        if: steps.queue.outputs.skip_tests != 'true'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: cargo xtask release-version resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - name: Toolchain
        if: steps.queue.outputs.skip_tests != 'true'
        run: rustup show
      - name: Install cargo-nextest
        if: steps.queue.outputs.skip_tests != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.104
      # Tag builds ship binaries, so they do not restore or save a cache.
      # Keep the kiln crates in the cache so a warm run reuses them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.queue.outputs.skip_tests != 'true' && !startsWith(github.ref, 'refs/tags/v')
        with:
          cache-workspace-crates: 'true'
      - name: Install Caddy
        if: steps.queue.outputs.skip_tests != 'true'
        run: bash scripts/install-caddy.sh
      - name: Socket activation tools
        if: steps.queue.outputs.skip_tests != 'true'
        run: |
          missing=
          command -v systemd-socket-activate >/dev/null || missing=1
          command -v ss >/dev/null || missing=1
          if [ ! -x /lib/systemd/systemd-socket-proxyd ] && [ ! -x /usr/lib/systemd/systemd-socket-proxyd ]; then
            missing=1
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y systemd iproute2
          fi
      - name: OpenSSH server
        if: steps.queue.outputs.skip_tests != 'true'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y openssh-server
          fi
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd
      - name: Test and lint
        if: steps.queue.outputs.skip_tests != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/server-check-run-test-and-lint.sh
      - name: Upload server-check test-and-lint log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-check-test-and-lint
          path: server-check-test-and-lint.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build release binaries for tag-path reuse
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.release_path == 'true' &&
          steps.queue.outputs.skip_tests != 'true'
        run: |
          cargo build --release --locked --bins -p kiln-server -p kiln-runtime -p kiln-client
          cargo build --release --locked -p kiln-identity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.release_path == 'true' &&
          steps.queue.outputs.skip_tests != 'true'
        with:
          name: server-check-release-bins
          path: |
            target/release/kiln
            target/release/kiln-runtime
            target/release/kiln-host
            target/release/kiln-api
            target/release/kiln-identity
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # A manual dry run fetches main's packages. A push builds in this run.
  reuse:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    # 15 minutes of polling, plus the previous budget for download and attest.
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      reason: ${{ steps.decide.outputs.reason }}
      server_check: ${{ steps.decide.outputs.server_check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Peel the tagged commit
        if: github.event_name == 'push'
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
      - name: Reuse main's packages when they verify
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_EVENT: ${{ github.event_name }}
          REUSE_SHA: ${{ github.sha }}
          REUSE_SHA_INPUT: ${{ inputs.reuse_sha }}
        # REUSE_VERSION stays unset. fetch reads Cargo.toml at that commit.
        # Package jobs named the archives with that version. version-guard
        # stamps those bytes onto the release ref when the two differ.
        run: |
          if [ "$REUSE_EVENT" = workflow_dispatch ] && [ -z "$REUSE_SHA_INPUT" ]; then
            REUSE_SHA_INPUT=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
            export REUSE_SHA_INPUT
          fi
          sh scripts/wait-main-run.sh
          if ! grep -q '^mode=fallback$' "$GITHUB_OUTPUT"; then
            cargo xtask reuse-release fetch --dist dist
          fi
          sh scripts/reuse-server-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.decide.outputs.mode == 'reuse'
        with:
          name: reused-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # A verified dry-run reuse skips this job. Any other result on a push runs it.
  # Pull requests and merge groups never package the server.
  server-package:
    needs: [reuse]
    # rehearsal: tag-path-dry-run
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.reuse.result == 'skipped' ||
        (github.event_name == 'push' &&
          !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask merge-queue-tested
      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: cargo xtask release-version resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - name: Reuse PR-proved server package
        id: proved_reuse
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.queue.outputs.skip_tests == 'true' &&
          steps.queue.outputs.proof_run_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "${{ steps.queue.outputs.proof_run_id }}" --repo "$GITHUB_REPOSITORY" --name package-server --dir dist
          (cd dist && sha256sum -c ./*.sha256)
      - name: Toolchain
        if: steps.proved_reuse.outcome != 'success'
        run: rustup show
      # Tag builds ship binaries, so they do not restore or save a cache.
      # Keep the kiln crates in the cache so a warm run reuses them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.proved_reuse.outcome != 'success' && !startsWith(github.ref, 'refs/tags/v')
        with:
          cache-workspace-crates: 'true'
      - name: Build and package server release
        if: steps.proved_reuse.outcome != 'success'
        run: PACKAGE_OUTPUT=dist sh scripts/package-server-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-server
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Docs-only pull requests and merge groups skip this job. A verified tag reuse skips it too.
  client:
    needs: [changes, reuse]
    if: >-
      !cancelled() &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.heavy != 'false') &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
        needs.reuse.result == 'skipped' ||
        (github.event_name == 'push' &&
          !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask merge-queue-tested
      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: cargo xtask release-version resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - name: Toolchain
        run: rustup show
      # Tag builds ship binaries, so they do not restore or save a cache.
      # Keep the kiln crates in the cache so a warm run reuses them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          cache-workspace-crates: 'true'
      - name: Native client TLS and CLI tests
        if: steps.queue.outputs.skip_tests != 'true'
        run: cargo test --locked -p kiln-api -p kiln-client --target ${{ matrix.target }}
      - name: Native shell bootstrap tests
        if: steps.queue.outputs.skip_tests != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask test-bootstrap
      - name: Production binary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cargo build --release --locked -p kiln-client --bin kiln --target ${{ matrix.target }}
          cargo xtask release-version check-binary --version "$VERSION" -- \
            target/${{ matrix.target }}/release/kiln
      - name: Test release packaging
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: cargo xtask test-release
      - name: Package client
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cargo xtask release client --version "$VERSION" --target ${{ matrix.target }} \
            --bin-dir target/${{ matrix.target }}/release --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # The intel runner is gone. This arm job still publishes package-x86_64-apple-darwin.
      - name: Cross-compile x86_64 macOS client
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked -p kiln-client --bin kiln --target x86_64-apple-darwin
          cargo xtask release-version check-binary --version "$VERSION" -- \
            target/x86_64-apple-darwin/release/kiln
      - name: Package x86_64 macOS client
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo xtask release client --version "$VERSION" --target x86_64-apple-darwin \
            --bin-dir target/x86_64-apple-darwin/release --output dist-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.target == 'aarch64-apple-darwin'
        with:
          name: package-x86_64-apple-darwin
          path: dist-x86_64/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Docs-only pull requests and merge groups skip this job. A verified tag reuse skips it too.
  dashboard:
    needs: [changes, reuse]
    if: >-
      !cancelled() &&
      ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.changes.result != 'success' || needs.changes.outputs.heavy != 'false') &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
        needs.reuse.result == 'skipped' ||
        (github.event_name == 'push' &&
          !(needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Merge queue already tested this tree
        id: queue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask merge-queue-tested
      - name: Stamp release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: cargo xtask release-version resolve --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: >-
          (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          needs.changes.outputs.web == 'true'
        with:
          node-version: '22'
          # Empty on a v* tag, so setup-node skips restore and save and still installs Node.
          cache: ${{ !startsWith(github.ref, 'refs/tags/v') && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Install dashboard dependencies
        if: >-
          (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - name: Test dashboard
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        working-directory: web
        run: |
          npm test
          npx prettier --check .
      - name: Build dashboard
        if: >-
          (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
          needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm run build
      - name: Check embedded release notes
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KILN_RELEASE_NOTES_PUBLISHED_BASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: sh scripts/check-embedded-release-notes.sh "$VERSION"
      - name: Resolve Playwright version
        id: playwright-version
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        run: |
          set -eu
          version=$(
            awk '
              index($0, "\"node_modules/playwright\":") { found = 1; next }
              found && index($0, "\"version\":") {
                line = $0
                sub(/.*"version": "/, "", line)
                sub(/".*/, "", line)
                print line
                exit
              }
            ' web/package-lock.json
          )
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-browsers
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          !startsWith(github.ref, 'refs/tags/v') &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        working-directory: web
        run: |
          set -eu
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            set -- npx playwright install-deps chromium
          else
            set -- npx playwright install --with-deps chromium
          fi
          if ! timeout 300 "$@"; then
            sleep 2
            timeout 300 "$@"
          fi
      - name: Browser tests
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        working-directory: web
        run: npm run test:browser
      - name: Proof smoke
        if: >-
          steps.queue.outputs.skip_tests != 'true' &&
          ((github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
            needs.changes.outputs.web == 'true')
        env:
          KILN_PROOF_SKIP_KILN_APP: 1
        run: sh scripts/test-proof.sh
      - name: Package static dashboard
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cargo xtask test-release
          cargo xtask release dashboard --version "$VERSION" --target web \
            --bin-dir web/dist --output dist
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: package-dashboard
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # reuse is skipped on main. An if with no status function is rewritten
  # to success(), and success() is false when an ancestor was skipped,
  # so this job never ran. !cancelled() blocks that rewrite. The result
  # checks still require the jobs that wrote the archives a tag publishes.
  attest:
    needs: [server-package, client, dashboard]
    if: >-
      !cancelled() &&
      needs.server-package.result == 'success' &&
      needs.client.result == 'success' &&
      needs.dashboard.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    # rehearsal: tag-path-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz

  # A main release names the next patch and creates that tag before this
  # job returns, so the next queued release sees it. A docs-only push sets
  # release=false and creates nothing.
  release-plan:
    needs: [required, server-check, server-package, client, dashboard]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false)) &&
      needs.required.result == 'success' &&
      needs.server-check.result == 'success' &&
      needs.server-package.result == 'success' &&
      needs.client.result == 'success' &&
      needs.dashboard.result == 'success'
    # rehearsal: tag-path-dry-run
    concurrency:
      group: kiln-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      from: ${{ steps.plan.outputs.from }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan the release
        id: plan
        env:
          BEFORE: ${{ inputs.batch_base_sha != '' && inputs.batch_base_sha || github.event.before }}
          AFTER: ${{ github.sha }}
          PLAN_RELEASE_APPLY: 1
          PLAN_RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/plan-release.sh

  # Stamp this run's packages onto the planned tag and check every client.
  # The Linux client is executed. macOS is checked by the slot.
  version-guard:
    needs: [release-plan, server-package, client, dashboard]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false)) &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.release == 'true' &&
      needs.server-package.result == 'success' &&
      needs.client.result == 'success' &&
      needs.dashboard.result == 'success'
    # rehearsal: tag-path-dry-run
    concurrency:
      group: kiln-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      stamped: ${{ steps.stamp.outputs.stamped }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Stamp packages onto the planned tag
        id: stamp
        env:
          FROM_TAG: ${{ needs.release-plan.outputs.from }}
          TAG: ${{ needs.release-plan.outputs.tag }}
        run: |
          if [ -z "$FROM_TAG" ] || [ -z "$TAG" ]; then
            echo "release plan did not name a version" >&2
            exit 1
          fi
          if [ "$TAG" = "$FROM_TAG" ]; then
            echo "stamped=false" >> "$GITHUB_OUTPUT"
          else
            sh scripts/stamp-release-dist.sh dist "$FROM_TAG" "$TAG"
            echo "stamped=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Check every shipped client
        env:
          TAG: ${{ needs.release-plan.outputs.tag }}
        run: sh scripts/check-stamped-clients.sh dist "$TAG"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: steps.stamp.outputs.stamped == 'true'
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.stamp.outputs.stamped == 'true'
        with:
          name: stamped-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # When a required compile job fails, stop the rest of the run so agents
  # do not wait on jobs that will be cancelled anyway.
  cancel-on-required-failure:
    needs: [changes, docs-check, feature-map-guard, server-check, client, dashboard, tag-path-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if cargo xtask cancel-on-failure-gate; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # A client matrix leg and a skipped client job are different check names.
  # always() still runs when a dependency fails or is skipped. Without it,
  # GitHub skips this job and the check never reports.
  required:
    needs: [changes, docs-check, feature-map-guard, server-check, client, dashboard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Required check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask required-gate

  draft-release:
    # Publish this run's packages. Attestations are bound to refs/heads/main.
    needs: [version-guard, release-plan, server-check, server-package, client, dashboard, attest]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false)) &&
      needs.release-plan.result == 'success' &&
      needs.release-plan.outputs.release == 'true' &&
      needs.version-guard.result == 'success' &&
      needs.server-check.result == 'success' &&
      needs.server-package.result == 'success' &&
      needs.client.result == 'success' &&
      needs.dashboard.result == 'success' &&
      needs.attest.result == 'success'
    # rehearsal: tag-path-dry-run
    concurrency:
      group: kiln-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-workspace-crates: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.version-guard.outputs.stamped == 'true'
        with:
          name: stamped-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.version-guard.outputs.stamped != 'true'
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify packages and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-plan.outputs.tag }}
          VERSION: ${{ needs.release-plan.outputs.tag }}
          KILN_RELEASE_NOTES_STRICT: "1"
          KILN_RELEASE_NOTES_PUBLISHED_BASE: "1"
        run: |
          started=$(date +%s)
          cargo xtask reuse-release finish --version "$VERSION" --dist dist
          (cd dist && sha256sum -c ./*.sha256)
          sh scripts/verify-release-attestations.sh dist
          notes=$(sh scripts/release-notes-markdown.sh "$TAG")
          gh release create "$TAG" dist/* --verify-tag --target "$GITHUB_SHA" --title "$TAG" \
            --notes "$notes"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            seconds=$(( $(date +%s) - started ))
            printf '| Stage | Seconds |\n| --- | ---: |\n| publish | %s |\n' "$seconds" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A tag created with this workflow's GITHUB_TOKEN does not start a second
  # workflow, so this job deploys in the same run.
  deploy:
    needs: [draft-release, release-plan]
    if: >-
      !cancelled() &&
      needs.draft-release.result == 'success' &&
      needs.release-plan.result == 'success'
    # rehearsal: tag-path-dry-run
    concurrency:
      group: kiln-release
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-plan.outputs.tag }}
    secrets: inherit

  dry-run-assets:
    needs: [reuse]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.dry_run &&
      needs.reuse.result == 'success' && needs.reuse.outputs.mode == 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reused-dist
          path: dist
      - name: Build the asset set without publishing
        env:
          VERSION: ${{ needs.reuse.outputs.version }}
        run: |
          cargo xtask reuse-release finish --version "$VERSION" --dist dist
          (cd dist && sha256sum -c ./*.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  reuse-fallback:
    needs: [reuse]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.dry_run &&
      needs.reuse.outputs.mode == 'fallback'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record that a tag push would build from scratch
        env:
          REASON: ${{ needs.reuse.outputs.reason }}
        run: echo "reuse refused (${REASON}) and a tag push would build from scratch"

  # Pull requests and main pushes rehearse a tag of main's latest green
  # packages onto v<patch+1>-dryrun. The real scripts do the work. Nothing
  # is published and no tag is pushed.
  tag-path-dry-run:
    needs: [changes, server-check]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.release_path == 'true' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && needs.server-check.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        if: github.event_name == 'pull_request'
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request'
        with:
          cache-workspace-crates: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'pull_request'
        with:
          name: server-check-release-bins
          path: server-check-release-bins
      - name: Make reused release binaries executable
        if: github.event_name == 'pull_request'
        run: |
          chmod +x \
            server-check-release-bins/kiln \
            server-check-release-bins/kiln-runtime \
            server-check-release-bins/kiln-host \
            server-check-release-bins/kiln-api \
            server-check-release-bins/kiln-identity
      - name: Dry-run the tag path
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TAG_PATH_RELEASE_BIN_DIR: ${{ github.workspace }}/server-check-release-bins
        run: sh scripts/tag-path-dry-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: package-server
          path: dist-proved-package-server/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
