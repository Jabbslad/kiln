name: Re-pin on a branch push

on:
  push:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - run: echo deploy

  repin:
    needs: [deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Open the pull request
        env:
          REPIN_TOKEN: ${{ secrets.REPIN_TOKEN }}
        run: |
          if [ -z "${REPIN_TOKEN:-}" ]; then
            printf '%s\n' 'REPIN_TOKEN is unset' >&2
            exit 1
          fi
          git push origin "HEAD:repin/${TAG}"
          gh pr create --base main --head "repin/${TAG}"
