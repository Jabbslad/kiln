name: Caller omits secrets

on:
  push:
    tags: ['v*']

jobs:
  deploy:
    needs: [draft-release]
    if: >-
      !cancelled() &&
      needs.draft-release.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
