[package]
name = "kiln-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["form", "json", "query"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
http = "1"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["use_pem", "rust_crypto"] }
kiln-api = { path = "../kiln-api" }
libc.workspace = true
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tokio.workspace = true
tower-http = { version = "0.6", features = ["limit", "set-header", "trace"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
